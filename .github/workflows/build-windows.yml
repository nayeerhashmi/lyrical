name: Build Lyrical for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lyric-video-generator-main/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lyric-video-generator-main
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lyric-video-generator-main/pyproject.toml

      - name: Install application and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build Windows desktop application
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name Lyrical --collect-all PyQt6 --collect-all moviepy --collect-all imageio_ffmpeg --copy-metadata imageio --copy-metadata imageio-ffmpeg --add-data "themes;themes" --add-data "assets;assets" src/gui/main.py

      - name: Package Windows application
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Lyrical/Lyrical.exe")) {
            throw "Build did not produce dist/Lyrical/Lyrical.exe"
          }
          Compress-Archive -Path "dist/Lyrical/*" -DestinationPath "dist/Lyrical-Windows.zip" -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Lyrical-Windows
          path: lyric-video-generator-main/dist/Lyrical-Windows.zip
          if-no-files-found: error
          retention-days: 14
